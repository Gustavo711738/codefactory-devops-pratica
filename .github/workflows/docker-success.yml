name: Build and Run Docker Image (Success)

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t codefactory-devops-pratica-web .

      - name: Run container
        run: docker run -d -p 5000:5000 codefactory-devops-pratica-web

      - name: Test endpoint
        run: |
          for i in {1..5}; do
            if curl --fail http://localhost:5000/ | grep -q "Hello CodeFactory"; then
              echo "Flask respondeu com sucesso!"
              break
            else
              echo "Tentativa $i falhou, aguardando..."
              sleep 5
            fi
          done
